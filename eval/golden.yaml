- id: MULTI-05
  category: multi_step
  user: neha
  turns: ["Are there any unusual attendance patterns or inconsistent records I should look into?"]
  expect:
    tools_all: [detect_anomalies]
    sql_any: >-
      SELECT e.full_name FROM hr.employees e WHERE (SELECT count(*) FROM hr.attendance a WHERE a.employee_id=e.id
      AND a.status='absent' AND a.date >= date '2026-11-25' - 60) >= 6
- id: MULTI-06
  category: multi_step
  user: priya
  turns: ["Show pending leave requests in my team.", "Which of these are for next week?", "Who will be available during that period?"]
  expect:
    tools_any: [team_availability]
    sql_any: >-
      SELECT e.full_name FROM hr.v_reporting_tree t JOIN hr.employees e ON e.id=t.employee_id WHERE t.manager_id=8 AND e.status='active'
      AND NOT EXISTS (SELECT 1 FROM hr.leave_requests r WHERE r.employee_id=e.id AND r.status IN ('approved','pending')
      AND daterange(r.start_date,r.end_date,'[]') && daterange('2026-11-30','2026-12-04','[]'))
