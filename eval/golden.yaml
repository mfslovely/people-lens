# Golden evaluation set for People Lens.
# Each case runs in a fresh session as the given seeded identity. Only the reply to the LAST turn is assessed.
#
# expect keys (all optional; a case passes only if every listed check passes):
#   tools_all:        every listed tool must be called (in the final turn)
#   tools_any:        at least one listed tool must be called
#   tools_none:       none of these may be called
#   contains_all / contains_any / not_contains: case-insensitive substring checks on the answer
#   sql_any:          SQL returning one text column; at least one value must appear in the answer (ground truth from live data)
#   sql_number:       SQL returning one number; it must appear in the answer
#   cite_doc:         a citation from this doc_key must be attached
#   abstain:          confidence must be "abstained"
#   blocked:          the input guard must have blocked the request (no LLM call)
#   pending_action:   expected proposal type (submit_leave | approve_request | reject_request) or "none"
#   confirm:          after the last turn, reply "yes"; the action must execute and return a request id
#   confirm_twice:    confirm again via the action API; must be already_executed with the same id
#   db_check:         SQL returning a boolean that must be true after the case
# vars: name -> SQL scalar, substituted into turns and SQL as {name}
# Persona ids: arjun=20 (employee, IT), rohan=21 (employee on probation), kavya=30 (employee, Sales),
#              priya=8 (manager, IT), vikram=9 (manager, Sales), neha=13 (HR admin). Today = 2026-11-25; next week = 2026-11-30..12-04.

